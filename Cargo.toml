[package]
name = "portpilot"
version = "0.1.0"
edition = "2024"
description = "Local development port manager for Linux and Omarchy"
license = "MIT"
repository = "https://github.com/kauanmassuia14/omaports"
readme = "README.md"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
libc = "0.2"

[dev-dependencies]
tempfile = "3"
