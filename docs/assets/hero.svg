<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title description">
  <title id="title">PortPilot — local development ports, under control</title>
  <desc id="description">A dark PortPilot dashboard showing four services mapped to their development projects and processes.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101720"/>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#79c0ff"/>
      <stop offset="1" stop-color="#388bfd"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000" flood-opacity=".35"/>
    </filter>
  </defs>
  <rect width="1200" height="560" rx="28" fill="url(#bg)"/>
  <path d="M0 432C220 370 330 530 575 440s388-145 625-67v187H0Z" fill="#121d29" opacity=".52"/>
  <g transform="translate(72 64)">
    <rect width="48" height="48" rx="14" fill="#17283a" stroke="#31506c"/>
    <circle cx="24" cy="24" r="13" fill="none" stroke="url(#accent)" stroke-width="2"/>
    <path d="M13 24h22M24 13v22M17 17l14 14M31 17 17 31" stroke="#79c0ff" stroke-width="1.5" opacity=".8"/>
    <circle cx="24" cy="24" r="3" fill="#3fb950"/>
    <text x="64" y="31" fill="#f0f6fc" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="700" letter-spacing="2.2">PORTPILOT</text>
    <text x="0" y="139" fill="#f0f6fc" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="52" font-weight="700" letter-spacing="-1.8">Know what is</text>
    <text x="0" y="197" fill="#f0f6fc" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="52" font-weight="700" letter-spacing="-1.8">listening.</text>
    <text x="2" y="244" fill="#aebdca" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="19">Local ports, connected to the projects behind them.</text>
    <text x="2" y="277" fill="#aebdca" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="19">Built for Linux development. At home in Omarchy.</text>
    <g transform="translate(0 328)" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">
      <rect width="126" height="34" rx="17" fill="#17283a" stroke="#263b50"/>
      <text x="63" y="22" text-anchor="middle" fill="#79c0ff">DISCOVER</text>
      <rect x="138" width="116" height="34" rx="17" fill="#17283a" stroke="#263b50"/>
      <text x="196" y="22" text-anchor="middle" fill="#79c0ff">IDENTIFY</text>
      <rect x="266" width="91" height="34" rx="17" fill="#17283a" stroke="#263b50"/>
      <text x="311" y="22" text-anchor="middle" fill="#79c0ff">ACT</text>
    </g>
    <text x="1" y="424" fill="#718096" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13" letter-spacing="1.1">LINUX  ·  HYPRLAND  ·  OMARCHY</text>
  </g>
  <g transform="translate(606 70)" filter="url(#shadow)">
    <rect width="522" height="418" rx="20" fill="#111820" stroke="#2a3542"/>
    <path d="M20 0h482a20 20 0 0 1 20 20v43H0V20A20 20 0 0 1 20 0Z" fill="#161f29"/>
    <circle cx="27" cy="31" r="5" fill="#f85149"/><circle cx="45" cy="31" r="5" fill="#d29922"/><circle cx="63" cy="31" r="5" fill="#3fb950"/>
    <text x="92" y="36" fill="#edf3fa" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="650">PortPilot</text>
    <rect x="412" y="17" width="90" height="28" rx="14" fill="#173422"/>
    <text x="457" y="36" text-anchor="middle" fill="#56d364" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="650">4 ACTIVE</text>
    <text x="24" y="96" fill="#728196" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="1.4">PORT</text>
    <text x="119" y="96" fill="#728196" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="1.4">PROJECT</text>
    <text x="329" y="96" fill="#728196" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="1.4">PROCESS</text>
    <text x="451" y="96" fill="#728196" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="1.4">STATE</text>
    <path d="M22 109h478" stroke="#26313c"/>
    <g font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14">
      <rect x="13" y="118" width="496" height="57" rx="10" fill="#182636"/>
      <text x="28" y="152" fill="#79c0ff" font-weight="700">5173</text><text x="119" y="152" fill="#f0f6fc" font-weight="600">postiq</text><text x="329" y="152" fill="#b2bdca">node</text><circle cx="467" cy="147" r="4" fill="#3fb950"/><text x="480" y="152" fill="#8b949e" font-size="12">LIVE</text>
      <text x="28" y="209" fill="#79c0ff" font-weight="700">3000</text><text x="119" y="209" fill="#f0f6fc" font-weight="600">postiq-api</text><text x="329" y="209" fill="#b2bdca">node</text><circle cx="467" cy="204" r="4" fill="#3fb950"/><text x="480" y="209" fill="#8b949e" font-size="12">LIVE</text>
      <text x="28" y="266" fill="#79c0ff" font-weight="700">5432</text><text x="119" y="266" fill="#f0f6fc" font-weight="600">postiq</text><text x="329" y="266" fill="#b2bdca">postgres</text><circle cx="467" cy="261" r="4" fill="#3fb950"/><text x="480" y="266" fill="#8b949e" font-size="12">DOCKER</text>
      <text x="28" y="323" fill="#79c0ff" font-weight="700">6379</text><text x="119" y="323" fill="#f0f6fc" font-weight="600">snaqturbo</text><text x="329" y="323" fill="#b2bdca">redis</text><circle cx="467" cy="318" r="4" fill="#3fb950"/><text x="480" y="323" fill="#8b949e" font-size="12">DOCKER</text>
    </g>
    <path d="M22 346h478" stroke="#26313c"/>
    <text x="24" y="382" fill="#758397" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12">Select a service to inspect its project and take action.</text>
  </g>
</svg>
