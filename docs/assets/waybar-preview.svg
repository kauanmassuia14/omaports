    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000" flood-opacity=".38"/></filter>
  </defs>
  <rect width="1200" height="360" rx="22" fill="url(#desktop)"/>
  <rect x="32" y="28" width="1136" height="52" rx="12" fill="#111820" stroke="#27323e"/>
