      <text x="24" y="208" fill="#79c0ff" font-weight="700">6379</text><text x="92" y="208" fill="#f0f6fc">snaqturbo</text><text x="274" y="208" fill="#9aa8b7">redis</text><circle cx="384" cy="203" r="4" fill="#3fb950"/>
